<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>Recordatorio</title>
  <link rel="stylesheet" href="recordatorio.css">
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <div class="icono" aria-hidden="true">
      <!-- Funciones: portapapeles con flecha hacia arriba -->
      <svg class="icono-funciones" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2" width="8" height="4" rx="1"></rect>
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <path d="M12 11v6"></path>
        <path d="M9 14l3-3 3 3"></path>
      </svg>
      <!-- Repositorio: rama de git con flecha hacia abajo -->
      <svg class="icono-repositorio" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="5" r="2.5"></circle>
        <circle cx="6" cy="19" r="2.5"></circle>
        <path d="M6 7.5v9"></path>
        <path d="M17 4v10"></path>
        <path d="M13.5 10.5L17 14l3.5-3.5"></path>
        <path d="M14 19h6"></path>
      </svg>
    </div>
    <div class="texto">
      <div class="titulo" id="titulo"></div>
      <div class="mensaje" id="mensaje"></div>
    </div>
    <div class="progreso" id="progreso"></div>
  </div>
  <script src="recordatorio.js"></script>
</body>
</html>
